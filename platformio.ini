[platformio]
default_envs = beacon_s3, beacon_c6

[env]
platform = espressif32 @ 8.0.0
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
board_upload.flash_size = 4MB
board_build.partitions = default.csv
; Both chips use their built-in USB-Serial/JTAG port: USB mode 1 + serial on boot.
; (PlatformIO's C6 board doesn't set USB mode itself, so it must be set here.)
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:beacon_s3]          ; zone 1-1 → "Test Room A"
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D DEFAULT_ZONE_MAJOR=1
    -D DEFAULT_ZONE_MINOR=1

[env:beacon_c6]          ; zone 1-2 → "Test Room B"
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -D DEFAULT_ZONE_MAJOR=1
    -D DEFAULT_ZONE_MINOR=2